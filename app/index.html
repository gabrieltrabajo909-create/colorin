<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF7F9">
<title>Colorin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#FFF7F9; --card:#FFFFFF; --ink:#3A2E39; --muted:#9A8A97; --line:#F1DDE5;
  --accent:#E8628F; --accent-soft:#FCE3EC; --good:#3FB27F;
  --font:ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* galería */
.gallery{height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.ghead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;max-width:900px}
.lang{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.lang button{padding:6px 11px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ibtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.gallery h1{margin:0 0 4px;font-size:30px;font-weight:900;letter-spacing:-.02em;color:var(--accent)}
.gallery p.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:900px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(232,98,143,.12);text-align:left;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.card .t{font-weight:800;font-size:15px}
.pbar{height:6px;border-radius:9px;background:var(--accent-soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.card .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* pintura */
.painter{position:fixed;inset:0;display:flex;flex-direction:column;background:#FBF3F6}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--bg)}
.bar .title{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pct{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.ibtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:0 1px 6px rgba(0,0,0,.08);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;position:relative;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.palette{display:flex;gap:10px;overflow-x:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.sw{flex:none;width:52px;height:52px;border-radius:50%;position:relative;display:grid;place-items:center;font-weight:900;font-size:16px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.sw svg{position:absolute;inset:-5px;width:62px;height:62px;transform:rotate(-90deg)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.sw.done{opacity:.35}
.center{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.done-card{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border-radius:20px;padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.15);text-align:center;width:max-content;max-width:calc(100% - 32px)}
.done-card b{display:block;font-size:20px;color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:10}
</style>
</head>
<body>

<section class="gallery" id="gallery">
  <div class="ghead">
    <div><h1>Colorin</h1><p class="sub" data-i18n="sub"></p></div>
    <div class="lang" role="group" aria-label="Idioma / Language"><button id="l-es">ES</button><button id="l-en">EN</button></div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="painter" id="painter" hidden>
  <div class="bar">
    <button class="ibtn" id="back" data-i18n-aria="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title" id="ptitle"></div>
    <div class="pct" id="pct"></div>
    <button class="ibtn" id="eye" data-i18n-aria="preview" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ibtn" id="find" data-i18n-aria="find"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="center" id="loading" data-i18n="loading"></div>
    <div class="done-card" id="donecard" hidden><b data-i18n="doneT"></b><span data-i18n="doneS"></span></div>
  </div>
  <div class="palette" id="palette"></div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem('colorin-' + k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem('colorin-' + k, v); } catch {} },
};
let catalog = [];

// ---------- idiomas ----------
const T = {
  es: { sub:'Elegí un dibujo y pintá por números', back:'Volver', preview:'Ver cómo queda terminado', find:'Buscar zona sin pintar', loading:'Cargando dibujo…',
        doneT:'¡Terminado! 🎉', doneS:'Quedó hermoso', finished:'¡Terminado!', fresh:'Nuevo', toastDone:'¡Terminaste el dibujo! 🎉', color:'Color' },
  en: { sub:'Pick a picture and color by number', back:'Back', preview:'See the finished picture', find:'Find an unpainted area', loading:'Loading picture…',
        doneT:'Finished! 🎉', doneS:'It looks beautiful', finished:'Finished!', fresh:'New', toastDone:'You finished the picture! 🎉', color:'Color' },
};
let lang = store.get('lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
const t = k => T[lang][k] || k;
const titleOf = it => (lang === 'en' && it.title_en) || it.title;
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#l-es').setAttribute('aria-pressed', lang === 'es'); $('#l-en').setAttribute('aria-pressed', lang === 'en');
}

// ---------- galería ----------
async function showGallery(){
  $('#painter').hidden = true; $('#gallery').hidden = false;
  if (!catalog.length) catalog = await (await fetch('catalog/index.json')).json();
  $('#grid').innerHTML = catalog.map(it => {
    const p = +(store.get('pct-' + it.id) || 0);
    const img = p >= 100 ? 'thumb.jpg' : 'line.png';
    return `<button class="card" data-id="${it.id}"><img src="catalog/${it.id}/${img}" alt="" loading="lazy"><div class="meta"><div class="t">${titleOf(it)}</div><div class="pbar"><i style="width:${p}%"></i></div><div class="p">${p >= 100 ? t('finished') : p ? p + '%' : t('fresh')}</div></div></button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c => c.onclick = () => openPic(c.dataset.id));
}

// ---------- estado del dibujo ----------
let P = null;   // { id, w, h, ids, pal, reg, px, off, bbox, filled, remain, total, done, paint, paintCtx, img, lines }
let sel = -1, preview = false;
const cv = $('#cv'), ctx = cv.getContext('2d');
let view = { s: 1, tx: 0, ty: 0 }, fitS = 1, dirty = true;

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lumOf = ([r, g, b]) => .299 * r + .587 * g + .114 * b;

async function openPic(id){
  const it = catalog.find(x => x.id === id);
  $('#gallery').hidden = true; $('#painter').hidden = false;
  $('#ptitle').textContent = titleOf(it); $('#loading').hidden = false; $('#donecard').hidden = true; $('#palette').innerHTML = '';
  P = null; dirty = true;
  const base = `catalog/${id}/`;
  const [data, bmp] = await Promise.all([
    fetch(base + 'data.json').then(r => r.json()),
    fetch(base + 'regions.png').then(r => r.blob()).then(b => createImageBitmap(b, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' })),
  ]);
  const w = data.w, h = data.h, N = data.regions.length;
  const tmp = new OffscreenCanvas(w, h), tctx = tmp.getContext('2d', { colorSpace: 'srgb' });
  tctx.drawImage(bmp, 0, 0);
  const raw = tctx.getImageData(0, 0, w, h).data;
  const ids = new Uint16Array(w * h);
  for (let i = 0, j = 0; i < ids.length; i++, j += 4) ids[i] = raw[j] * 256 + raw[j + 1];

  // píxeles de cada zona (orden por conteo) y su rectángulo
  const count = new Uint32Array(N + 2), off = new Uint32Array(N + 2), px = new Uint32Array(w * h);
  for (let i = 0; i < ids.length; i++) count[ids[i]]++;
  for (let r = 1; r <= N + 1; r++) off[r] = off[r - 1] + count[r - 1];
  const fillPos = off.slice();
  const bbox = new Int32Array((N + 1) * 4);
  for (let r = 0; r <= N; r++) { bbox[r*4] = w; bbox[r*4+1] = h; bbox[r*4+2] = -1; bbox[r*4+3] = -1; }
  for (let i = 0; i < ids.length; i++) {
    const r = ids[i]; px[fillPos[r]++] = i;
    const x = i % w, y = (i / w) | 0, b = r * 4;
    if (x < bbox[b]) bbox[b] = x; if (y < bbox[b+1]) bbox[b+1] = y; if (x > bbox[b+2]) bbox[b+2] = x; if (y > bbox[b+3]) bbox[b+3] = y;
  }

  const pal = data.palette.map(hex);
  const reg = data.regions;           // [color, x, y, radio] ; zona i+1
  const saved = store.get('fill-' + id + '-' + N);   // si el dibujo cambia de zonas, empieza de cero
  const filled = new Uint8Array(N + 1);
  if (saved) { try { const b = atob(saved); for (let r = 1; r <= N; r++) filled[r] = (b.charCodeAt(r >> 3) >> (r & 7)) & 1; } catch {} }
  const remain = new Int32Array(pal.length), totalC = new Int32Array(pal.length);
  let done = 0;
  for (let r = 1; r <= N; r++) { const c = reg[r - 1][0]; totalC[c]++; if (filled[r]) done++; else remain[c]++; }

  // capa de pintura (blanco / color) y capa de contornos
  const paint = new OffscreenCanvas(w, h), paintCtx = paint.getContext('2d');
  const img = paintCtx.createImageData(w, h);
  const lines = new OffscreenCanvas(w, h), lctx = lines.getContext('2d'), limg = lctx.createImageData(w, h);
  for (let i = 0; i < ids.length; i++) {
    const r = ids[i], j = i * 4;
    const col = filled[r] ? pal[reg[r - 1][0]] : [255, 255, 255];
    img.data[j] = col[0]; img.data[j+1] = col[1]; img.data[j+2] = col[2]; img.data[j+3] = 255;
    const x = i % w;
    if ((x < w - 1 && ids[i + 1] !== r) || (i + w < ids.length && ids[i + w] !== r)) { limg.data[j] = 110; limg.data[j+1] = 100; limg.data[j+2] = 110; limg.data[j+3] = 150; }
  }
  paintCtx.putImageData(img, 0, 0); lctx.putImageData(limg, 0, 0);

  P = { id, w, h, N, ids, pal, reg, px, off, bbox, filled, remain, totalC, done, paint, paintCtx, img, lines, final: null };
  preview = false; $('#eye').setAttribute('aria-pressed', 'false');
  $('#loading').hidden = true;
  fitView();
  sel = -1;
  buildPalette();
  const first = pal.findIndex((_, c) => remain[c] > 0);
  if (first >= 0) selectColor(first); else finish(false);
  updatePct();
}

// ---------- vista: ajustar, zoom y paneo ----------
function sizeCanvas(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; dirty = true; }
  return [r.width, r.height];
}
function fitView(){
  const [W, H] = sizeCanvas();
  fitS = Math.min(W / P.w, H / P.h) * .96;
  view = { s: fitS, tx: (W - P.w * fitS) / 2, ty: (H - P.h * fitS) / 2 };
  dirty = true;
}
const MAX_S = () => fitS * 30;
function zoomAt(mx, my, ns){
  ns = Math.max(fitS * .8, Math.min(MAX_S(), ns));
  const ix = (mx - view.tx) / view.s, iy = (my - view.ty) / view.s;
  view.s = ns; view.tx = mx - ix * ns; view.ty = my - iy * ns; clampView(); dirty = true;
}
function clampView(){
  const [W, H] = sizeCanvas(), m = 60;
  view.tx = Math.min(W - m, Math.max(m - P.w * view.s, view.tx));
  view.ty = Math.min(H - m, Math.max(m - P.h * view.s, view.ty));
}

// ---------- dibujo ----------
function render(){
  requestAnimationFrame(render);
  if (!P || !dirty) return;
  dirty = false;
  const [W, H] = sizeCanvas(), dpr = devicePixelRatio || 1, { s, tx, ty } = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#FBF3F6'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * tx, dpr * ty);
  ctx.imageSmoothingEnabled = s * dpr < 2.5;
  if (preview) { ctx.drawImage(finalImage(), 0, 0); return; }
  ctx.drawImage(P.paint, 0, 0);
  if (P.done < P.N) ctx.drawImage(P.lines, 0, 0);

  // números de las zonas sin pintar que entran en pantalla
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fam = getComputedStyle(document.body).fontFamily;
  const x0 = -tx / s, y0 = -ty / s, x1 = (W - tx) / s, y1 = (H - ty) / s;
  for (let r = 1; r <= P.N; r++) {
    if (P.filled[r]) continue;
    const [c, x, y, rad] = P.reg[r - 1];
    const sr = rad * s;
    if (sr < 6.5 || x < x0 || x > x1 || y < y0 || y > y1) continue;
    const fs = Math.min(sr * 1.15, 26);
    ctx.font = `${c === sel ? 900 : 600} ${fs}px ${fam}`;
    ctx.fillStyle = c === sel ? '#2B2230' : 'rgba(80,70,80,.75)';
    ctx.fillText(c + 1, x * s + tx, y * s + ty);
  }
}

// la imagen terminada, armada una sola vez con los colores de cada zona
function finalImage(){
  if (P.final) return P.final;
  const c = new OffscreenCanvas(P.w, P.h), cx = c.getContext('2d'), im = cx.createImageData(P.w, P.h), d = im.data;
  for (let i = 0; i < P.ids.length; i++) { const col = P.pal[P.reg[P.ids[i] - 1][0]], j = i * 4; d[j] = col[0]; d[j+1] = col[1]; d[j+2] = col[2]; d[j+3] = 255; }
  cx.putImageData(im, 0, 0);
  return P.final = c;
}
$('#eye').onclick = () => { if (!P) return; preview = !preview; $('#eye').setAttribute('aria-pressed', preview); dirty = true; };

// colorea los píxeles de una zona y marca el rectángulo a actualizar
function setRegionPixels(r, mode){          // mode: 'fill' | 'blank' | 'hint'
  const { px, off, img, w } = P, d = img.data, col = mode === 'fill' ? P.pal[P.reg[r - 1][0]] : null;
  for (let k = off[r]; k < off[r + 1]; k++) {
    const i = px[k], j = i * 4;
    if (mode === 'fill') { d[j] = col[0]; d[j+1] = col[1]; d[j+2] = col[2]; }
    else if (mode === 'hint') { const x = i % w, y = (i / w) | 0, v = ((x >> 2) ^ (y >> 2)) & 1 ? 196 : 222; d[j] = v; d[j+1] = v; d[j+2] = v; }
    else { d[j] = 255; d[j+1] = 255; d[j+2] = 255; }
  }
}
function flush(r){
  if (r == null) { P.paintCtx.putImageData(P.img, 0, 0); }
  else { const b = r * 4, x = P.bbox[b], y = P.bbox[b+1]; P.paintCtx.putImageData(P.img, 0, 0, x, y, P.bbox[b+2] - x + 1, P.bbox[b+3] - y + 1); }
  dirty = true;
}

function selectColor(c){
  if (sel === c) return;
  for (let r = 1; r <= P.N; r++) if (!P.filled[r]) {
    const rc = P.reg[r - 1][0];
    if (rc === sel) setRegionPixels(r, 'blank'); else if (rc === c) setRegionPixels(r, 'hint');
  }
  sel = c; flush();
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', +b.dataset.c === c));
  const el = document.querySelector(`.sw[data-c="${c}"]`); if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function fillRegion(r){
  if (!r || P.filled[r] || P.reg[r - 1][0] !== sel) return false;
  P.filled[r] = 1; P.done++; P.remain[sel]--;
  setRegionPixels(r, 'fill'); flush(r);
  updateSwatch(sel); updatePct(); scheduleSave();
  if (navigator.vibrate) try { navigator.vibrate(6); } catch {}
  if (P.remain[sel] === 0) {
    if (P.done === P.N) { finish(true); return true; }
    const next = P.pal.findIndex((_, c) => P.remain[c] > 0 && c > sel);
    selectColor(next >= 0 ? next : P.pal.findIndex((_, c) => P.remain[c] > 0));
  }
  return true;
}

function finish(celebrate){
  sel = -1; $('#donecard').hidden = false; fitView(); dirty = true;
  if (celebrate) toast(t('toastDone'));
}

// ---------- paleta ----------
function buildPalette(){
  $('#palette').innerHTML = P.pal.map((col, c) => {
    const ink = lumOf(col) > 150 ? '#2B2230' : '#fff';
    return `<button class="sw" data-c="${c}" style="background:rgb(${col});color:${ink}" aria-label="${t('color')} ${c + 1}"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="29" fill="none" stroke="#E8628F" stroke-width="3" stroke-dasharray="0 999"/></svg><span>${c + 1}</span></button>`;
  }).join('');
  document.querySelectorAll('.sw').forEach(b => { b.onclick = () => { if (P.remain[+b.dataset.c] > 0) selectColor(+b.dataset.c); }; updateSwatch(+b.dataset.c); });
}
function updateSwatch(c){
  const b = document.querySelector(`.sw[data-c="${c}"]`); if (!b) return;
  const doneFrac = 1 - P.remain[c] / P.totalC[c], L = 2 * Math.PI * 29;
  b.querySelector('circle').setAttribute('stroke-dasharray', `${doneFrac * L} ${L}`);
  b.classList.toggle('done', P.remain[c] === 0);
  if (P.remain[c] === 0) b.querySelector('span').textContent = '✓';
}
function updatePct(){
  const p = Math.floor(P.done / P.N * 100);
  $('#pct').textContent = p + '%';
}

// ---------- guardado ----------
let saveT;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(save, 600); }
function save(){
  if (!P) return;
  const bytes = new Uint8Array((P.N >> 3) + 1);
  for (let r = 1; r <= P.N; r++) if (P.filled[r]) bytes[r >> 3] |= 1 << (r & 7);
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  store.set('fill-' + P.id + '-' + P.N, btoa(s));
  store.set('pct-' + P.id, P.done === P.N ? 100 : Math.floor(P.done / P.N * 100));
}
addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------- gestos: tocar para pintar, arrastrar, pellizcar ----------
const pts = new Map(); let gesture = null;
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
const regionAt = (mx, my) => {
  const x = Math.floor((mx - view.tx) / view.s), y = Math.floor((my - view.ty) / view.s);
  return x < 0 || y < 0 || x >= P.w || y >= P.h ? 0 : P.ids[y * P.w + x];
};
cv.addEventListener('pointerdown', e => {
  if (!P) return;
  try { cv.setPointerCapture(e.pointerId); } catch {}
  pts.set(e.pointerId, local(e));
  if (pts.size === 1) {
    const [x, y] = local(e), r = regionAt(x, y);
    const canPaint = !preview && r && !P.filled[r] && P.reg[r - 1][0] === sel;
    gesture = { type: canPaint ? 'paint' : 'pan', x0: x, y0: y, tx: view.tx, ty: view.ty, moved: false };
    if (canPaint) fillRegion(r);
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    gesture = { type: 'pinch', d0: Math.hypot(a[0] - b[0], a[1] - b[1]), m0: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s0: view.s, tx: view.tx, ty: view.ty };
  }
});
cv.addEventListener('pointermove', e => {
  if (!P || !pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, local(e));
  const [x, y] = local(e);
  if (gesture.type === 'pinch' && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const ns = Math.max(fitS * .8, Math.min(MAX_S(), gesture.s0 * d / gesture.d0));
    const ix = (gesture.m0[0] - gesture.tx) / gesture.s0, iy = (gesture.m0[1] - gesture.ty) / gesture.s0;
    view.s = ns; view.tx = m[0] - ix * ns; view.ty = m[1] - iy * ns; clampView(); dirty = true;
  } else if (gesture.type === 'paint' && !preview) {
    fillRegion(regionAt(x, y));
  } else if (gesture.type === 'pan') {
    if (Math.hypot(x - gesture.x0, y - gesture.y0) > 8) gesture.moved = true;
    if (gesture.moved) { view.tx = gesture.tx + x - gesture.x0; view.ty = gesture.ty + y - gesture.y0; clampView(); dirty = true; }
  }
});
const up = e => {
  pts.delete(e.pointerId);
  if (pts.size === 0) gesture = null;
  else if (pts.size === 1 && gesture && gesture.type === 'pinch') { const [p] = [...pts.values()]; gesture = { type: 'pan', x0: p[0], y0: p[1], tx: view.tx, ty: view.ty, moved: true }; }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { if (!P) return; e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, view.s * Math.exp(-e.deltaY * .0015)); }, { passive: false });
cv.addEventListener('dblclick', e => { if (!P) return; const [x, y] = local(e); zoomAt(x, y, view.s * 2); });

// lupa: lleva a una zona sin pintar del color elegido
$('#find').onclick = () => {
  if (!P || sel < 0) return;
  const [W, H] = sizeCanvas(), cx = (W / 2 - view.tx) / view.s, cy = (H / 2 - view.ty) / view.s;
  let best = 0, bd = Infinity;
  for (let r = 1; r <= P.N; r++) if (!P.filled[r] && P.reg[r - 1][0] === sel) {
    const [, x, y] = P.reg[r - 1], d = (x - cx) ** 2 + (y - cy) ** 2; if (d < bd) { bd = d; best = r; }
  }
  if (!best) return;
  const [, x, y, rad] = P.reg[best - 1];
  const ns = Math.max(view.s, Math.min(MAX_S(), 16 / Math.max(rad, 1)));
  view.s = ns; view.tx = W / 2 - x * ns; view.ty = H / 2 - y * ns; clampView(); dirty = true;
};

$('#back').onclick = () => { save(); P = null; showGallery(); };
addEventListener('resize', () => { if (P) { clampView(); dirty = true; } });

let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

$('#l-es').onclick = () => { lang = 'es'; store.set('lang', lang); applyLang(); showGallery(); };
$('#l-en').onclick = () => { lang = 'en'; store.set('lang', lang); applyLang(); showGallery(); };
applyLang();
requestAnimationFrame(render);
showGallery();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
